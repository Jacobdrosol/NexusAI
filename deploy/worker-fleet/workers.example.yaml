fleet:
  control_plane_url: http://control_plane:8000
  control_plane_token_env: CONTROL_PLANE_API_TOKEN
  # Use a unique, stable name so repeated `docker compose -f` runs update this fleet.
  compose_project_name: example-worker-fleet
  docker_network: nexusai_nexus-net
  worker_node_source: ../../../nexus-worker-node
  image: nexus-worker-node:latest
  provider: ollama_cloud
  default_model: glm-5.2:cloud
  ollama_api_key_env: OLLAMA_API_KEY
  ollama_cloud_base_url: https://ollama.com/api
  cloud_context_policy: redact
  heartbeat_interval_seconds: 15
  internal_worker_port: 8010
  bot_priority: 10
  # Hard cap after replica expansion. Explicitly raise this only after host-capacity review.
  max_workers: 64
  # Disabled workers render behind this non-default Compose profile and do not start from `docker compose up`.
  disabled_worker_compose_profile: staged
  # Only enabled workers count against this admission budget. Raise it only after measuring host headroom.
  resource_budget:
    cpus: "8.0"
    memory: 16g
  backend_params:
    temperature: 0.2
    max_tokens: 1200
  # Default restart policy for all workers in this fleet.
  #   auto   -> Docker "unless-stopped" (restarts on reboot unless explicitly stopped)
  #   always -> Docker "always" (restarts unconditionally, even after explicit stop)
  #   manual -> Docker "no" (never restarts automatically; must be started manually)
  # Individual workers can override this with their own restart_policy field.
  restart_policy: auto

workers:
  - id: example-qc-reader-01
    name: Example QC Reader
    role: qc-reader
    # Renderer expands IDs, services, names, and generated bot IDs with -01, -02, ...
    replicas: 1
    service: example-qc-reader-01
    can_edit: false
    task_scope: read-only-quality-review
    allowed_pages:
      - /admin/dashboard
      - /admin/documentation
    course_scope: []
    lesson_scope: []
    models:
      - glm-5.2:cloud
    runtime:
      # Values are sourced only from the private deployment environment.
      env_from: {}
    tooling:
      # Declare tools installed in this node's image; this never installs or authenticates them.
      cli_tools: []
    bot:
      id: example-qc-reader-bot
    # Override the fleet-level restart_policy for this worker.
    # One of: auto, always, manual
    restart_policy: auto
