networks:
  nexus-bluegreen:
    driver: bridge
  nexus-net:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-nexusai}_nexus-net

services:
  dashboard_gateway:
    image: nginx:1.27-alpine
    container_name: nexus-dashboard-gateway
    restart: unless-stopped
    shm_size: "${NEXUSAI_GATEWAY_SHM_SIZE:-64m}"
    cpus: "${NEXUSAI_GATEWAY_CPUS:-0.5}"
    mem_limit: "${NEXUSAI_GATEWAY_MEM_LIMIT:-256m}"
    memswap_limit: "${NEXUSAI_GATEWAY_MEMSWAP_LIMIT:-512m}"
    pids_limit: ${NEXUSAI_GATEWAY_PIDS_LIMIT:-128}
    ports:
      - "5000:5000"
    volumes:
      - ${NEXUSAI_RUNTIME_DATA_DIR:-./data}/nginx:/etc/nginx/conf.d
    networks:
      - nexus-bluegreen
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  dashboard_blue:
    container_name: nexus-dashboard-blue
    restart: unless-stopped
    shm_size: "${NEXUSAI_DASHBOARD_SHM_SIZE:-256m}"
    cpus: "${NEXUSAI_DASHBOARD_CPUS:-1.0}"
    mem_limit: "${NEXUSAI_DASHBOARD_MEM_LIMIT:-1g}"
    memswap_limit: "${NEXUSAI_DASHBOARD_MEMSWAP_LIMIT:-2g}"
    pids_limit: ${NEXUSAI_DASHBOARD_PIDS_LIMIT:-256}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    env_file: .env
    environment:
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://control_plane:8000}
    volumes:
      - ${NEXUSAI_RUNTIME_DATA_DIR:-./data}:/app/data
      - ./.git:/app/.git
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - nexus-bluegreen
      - nexus-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 20s
      retries: 5
    profiles: ["blue"]

  dashboard_green:
    container_name: nexus-dashboard-green
    restart: unless-stopped
    shm_size: "${NEXUSAI_DASHBOARD_SHM_SIZE:-256m}"
    cpus: "${NEXUSAI_DASHBOARD_CPUS:-1.0}"
    mem_limit: "${NEXUSAI_DASHBOARD_MEM_LIMIT:-1g}"
    memswap_limit: "${NEXUSAI_DASHBOARD_MEMSWAP_LIMIT:-2g}"
    pids_limit: ${NEXUSAI_DASHBOARD_PIDS_LIMIT:-256}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    env_file: .env
    environment:
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://control_plane:8000}
    volumes:
      - ${NEXUSAI_RUNTIME_DATA_DIR:-./data}:/app/data
      - ./.git:/app/.git
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - nexus-bluegreen
      - nexus-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 20s
      retries: 5
    profiles: ["green"]
